name: site_daily_log
description: Offline-first site tracking app for construction engineers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.12.0
  geolocator: ^11.0.0
  uuid: ^4.3.3
  share_plus: ^12.0.1
  collection: ^1.18.0

  # --- Added: zero-cost Google Drive backup/restore ---
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1

  # --- Added: Excel (.xlsx) export alongside PDF reports ---
  excel: ^4.0.6

  # --- Added: site photo compression before local save ---
  flutter_image_compress: ^2.3.0

  # --- Added: reactive state for sync status / dashboard badges ---
  provider: ^6.1.2

  # --- Added: visual analytics dashboards ---
  fl_chart: ^0.66.0

  # --- Added: GPS photo watermarking ---
  image: ^4.1.3

  # --- Added: open linked Google Sheet in browser ---
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
